<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden}
body{font-family:Inter,sans-serif;color:#f1f1f1}
#stage{position:relative;display:flex;align-items:center;justify-content:center;gap:56px}
body.v #stage{width:1080px;height:1920px;flex-direction:column;gap:70px}
body.h #stage{width:1920px;height:1080px;flex-direction:row}
#bg{position:absolute;inset:0;background:radial-gradient(ellipse 45% 38% at 50% 50%,rgba(255,123,28,.35),transparent 70%);opacity:0}
body.h #bg{background:radial-gradient(ellipse 30% 45% at 32% 50%,rgba(255,123,28,.35),transparent 70%)}
#mark{position:relative;display:grid;place-items:center}
body.v #mark{width:460px;height:460px}
body.h #mark{width:400px;height:400px}
#mark svg{width:100%;height:100%;overflow:visible}
#ring{position:absolute;width:60%;height:60%;border:5px solid #ff7b1c;border-radius:50%;opacity:0;top:5%;left:30%}
#txt{position:relative}
body.v #txt{text-align:center}
#t1{font-weight:900;white-space:nowrap;line-height:1;opacity:0}
#t2{font-weight:700;color:#ff7b1c;white-space:nowrap;margin-top:22px;opacity:0}
#t3{color:#8a8a8a;font-weight:700;letter-spacing:4px;text-transform:uppercase;margin-top:34px;opacity:0}
body.v #t1{font-size:104px}body.v #t2{font-size:40px}body.v #t3{font-size:26px}
body.h #t1{font-size:120px}body.h #t2{font-size:46px}body.h #t3{font-size:28px}
</style></head><body>
<div id="stage"><div id="bg"></div>
<div id="mark"><div id="ring"></div>
<svg id="ic" viewBox="0 0 64 64">
<path id="p1" d="M10 28L30 54L50 14" fill="none" stroke="#c2540a" stroke-width="9.5" stroke-linejoin="miter" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<path id="p2" d="M10 28L30 54L50 14" fill="none" stroke="#ff8a2b" stroke-width="5" stroke-linejoin="miter" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
<g id="hd" style="transform-box:fill-box;transform-origin:50% 100%;transform:scale(0)">
<polygon points="54.9,3.2 59.2,18.4 40.8,9.4" fill="#c2540a" stroke="#c2540a" stroke-width="1.2" stroke-linejoin="miter"/>
<polygon points="53.2,7.6 55.8,15.4 46,10.6" fill="#ff8a2b"/></g></svg></div>
<div id="txt"><div id="t1">FORA DA CURVA</div><div id="t2">LICENCIADO</div><div id="t3">NFC · Negócios Fora da Curva</div></div></div>
<script>
const q=new URLSearchParams(location.search);document.body.className=q.get('o')||'v';
const $=i=>document.getElementById(i),cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,out=x=>1-Math.pow(1-x,3),back=x=>{const c=1.70158+1;return 1+c*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2)};
const v=document.body.className==='v';
window.setT=function(t){
  const dr=io(cl((t-.2)/1.1));$('p1').style.strokeDashoffset=1-dr;$('p2').style.strokeDashoffset=1-dr;
  $('hd').style.transform=`scale(${back(cl((t-1.2)/.45))})`;
  const fp=cl((t-1.35)/.8);$('ring').style.opacity=fp>0&&fp<1?.55*(1-fp):0;$('ring').style.transform=`scale(${.3+2.9*out(fp)})`;
  const k=cl((t-1.3)/.7)*(.7+.3*Math.sin((t-1.3)*2.4));
  $('ic').style.filter=`drop-shadow(0 0 ${4+16*k}px rgba(255,123,28,${.25+.55*k}))`;$('bg').style.opacity=.15+.85*k;
  const a=cl((t-1.45)/.7);$('t1').style.opacity=a;$('t1').style.clipPath=`inset(0 ${(1-out(a))*100}% 0 0)`;$('t1').style.transform=`translateY(${(1-out(a))*24}px)`;
  const b=cl((t-1.95)/.7);$('t2').style.opacity=b;$('t2').style.letterSpacing=((1-out(b))*24+(v?18:20))+'px';
  const c=cl((t-2.6)/.6);$('t3').style.opacity=c;
  const f=1-cl((t-4.3)/.7);$('stage').style.opacity=f;$('stage').style.transform=`scale(${1+.035*t/5})`;
};
setT(0);
</script></body></html>
