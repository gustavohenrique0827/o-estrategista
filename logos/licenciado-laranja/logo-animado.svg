<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 64" height="64" role="img" aria-label="Licenciado Fora da Curva" class="lg-anim"><style>
.lg-anim{overflow:visible}
.lg-shaft{stroke-dasharray:1;stroke-dashoffset:1;animation:lgdraw 1.1s cubic-bezier(.6,0,.2,1) .25s forwards}
.lg-head{transform-box:fill-box;transform-origin:50% 100%;animation:lgpop .5s cubic-bezier(.3,1.7,.5,1) 1.2s both}
.lg-glow{animation:lgglow 3.2s ease-in-out 1.9s infinite}
.lg-t1{animation:lgin .7s cubic-bezier(.2,.8,.2,1) 1s both}
.lg-t2{animation:lgin .7s cubic-bezier(.2,.8,.2,1) 1.4s both}
@keyframes lgdraw{to{stroke-dashoffset:0}}
@keyframes lgpop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes lgin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes lgglow{0%,100%{filter:drop-shadow(0 0 2px rgba(255,123,28,.30))}50%{filter:drop-shadow(0 0 9px rgba(255,123,28,.80))}}
@media (prefers-reduced-motion:reduce){.lg-shaft,.lg-head,.lg-glow,.lg-t1,.lg-t2{animation:none!important;stroke-dashoffset:0!important}}
</style><g class="lg-glow"><path d="M10 28L30 54L50 14" fill="none" stroke="#c2540a" stroke-width="9.5" stroke-linejoin="miter" pathLength="1" class="lg-shaft"/><path d="M10 28L30 54L50 14" fill="none" stroke="#ff8a2b" stroke-width="5" stroke-linejoin="miter" pathLength="1" class="lg-shaft"/><g class="lg-head"><polygon points="54.9,3.2 59.2,18.4 40.8,9.4" fill="#c2540a" stroke="#c2540a" stroke-width="1.2" stroke-linejoin="miter"/><polygon points="53.2,7.6 55.8,15.4 46,10.6" fill="#ff8a2b"/></g></g><text class="lg-t1" x="76" y="31" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-weight="900" font-size="21" letter-spacing="1.2" fill="#f1f1f1">FORA DA CURVA</text><text class="lg-t2" x="76" y="53" font-family="Inter,'Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="12" letter-spacing="8.2" fill="#ff7b1c">LICENCIADO</text></svg>